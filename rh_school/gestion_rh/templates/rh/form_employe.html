{% extends "base.html" %}
{% block title %}Formulaire Employé{% endblock %}

{% block content %}
<div class="container">
    <h1>{{ titre }}</h1>
    <form method="post" class="form-container">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a href="{% url 'liste_employes' %}" class="btn btn-secondary">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
