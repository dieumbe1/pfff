{% extends "base.html" %}

{% block title %}Demande de Congé{% endblock %}

{% block content %}
    <h1>Demande de Congé</h1>
    <p>Remplissez les dates et le motif de votre demande.</p>
    
    <div class="form-container">
        <form method="post">
            {% csrf_token %}
            
            {{ form.as_p }} 

            <button type="submit" class="btn-submit">Soumettre ma Demande</button>
        </form>
    </div>
    
    <p><a href="{% url 'liste_conges' %}">Retour à la Liste</a></p>
{% endblock %}
