{% extends "base.html" %}

{% block title %}Ajouter/Modifier Formation{% endblock %}

{% block content %}
    <h1>{% if form.instance.pk %}Modifier{% else %}Ajouter{% endif %} une Formation</h1>
    
    <div class="form-container">
        <form method="post">
            {% csrf_token %}
            
            {{ form.as_p }} 

            <button type="submit" class="btn-submit">Sauvegarder</button>
        </form>
    </div>
    
    <p><a href="{% url 'liste_formations' %}">Retour au Catalogue</a></p>
{% endblock %}
