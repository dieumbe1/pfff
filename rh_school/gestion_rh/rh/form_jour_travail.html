{% extends "base.html" %}

{% block title %}Définir Horaire{% endblock %}

{% block content %}
    <h1>{% if form.instance.pk %}Modifier{% else %}Définir{% endif %} les Horaires</h1>
    
    <div class="form-container">
        <form method="post">
            {% csrf_token %}
            
            {{ form.as_p }} 

            <button type="submit" class="btn-submit">Sauvegarder</button>
        </form>
    </div>
    
    <p><a href="{% url 'liste_jours_travail' %}">Retour à la Liste</a></p>
{% endblock %}
